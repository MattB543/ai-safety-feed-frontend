[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true

# The backend renders the sitemap (every post's /similar page); serve it from
# this domain so robots.txt can point at it.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://ai-safety-feed-backend.onrender.com/sitemap.xml"
  status = 200
  force = true

# SPA redirect rule (keep last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200